<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Band Name</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  background: black;
  transition: background 2s ease-in-out;
}

/* Animated background */
.background-animate {
  position: fixed;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: radial-gradient(circle at center, #4b0082, black 60%);
  animation: moveBg 25s linear infinite;
  z-index: -2;
  opacity: 0.5;
}

@keyframes moveBg {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.overlay {
  background: rgba(0,0,0,0.85);
  min-height: 100vh;
  padding: 30px 20px 140px 20px;
}

/* Logo */
.logo {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  letter-spacing: 5px;
  color: #bb66ff;
  text-shadow: 0 0 15px #bb66ff, 0 0 30px purple;
  margin-bottom: 40px;
}

/* Playlist */
.playlist {
  max-width: 800px;
  margin: 0 auto;
  max-height: 500px;
  overflow-y: auto;
  border: 1px solid purple;
  background: rgba(0,0,0,0.6);
}

.song {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  transition: background 0.2s;
}

.song img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border: 1px solid purple;
}

.song:hover {
  background: rgba(128,0,128,0.4);
}

.song.active {
  background: rgba(187,102,255,0.5);
  font-weight: bold;
}

.song-info {
  flex: 1;
}

.download {
  color: #bb66ff;
  text-decoration: none;
  font-size: 14px;
}

/* Sticky Player */
.sticky-player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0a0a0a;
  border-top: 3px solid purple;
  padding: 15px;
  box-shadow: 0 -5px 20px rgba(187,102,255,0.3);
}

.now-playing {
  font-weight: bold;
  color: #bb66ff;
  margin-bottom: 10px;
  font-size: 18px;
}

/* BIGGER CONTROLS */
.controls {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.control-btn {
  width: 55px;
  height: 55px;
  background: linear-gradient(145deg, #2b0033, #000);
  border: 2px solid purple;
  color: #bb66ff;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(187,102,255,0.6);
  transition: all 0.2s ease;
}

.control-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #bb66ff;
}

.control-btn.active {
  background: #bb66ff;
  color: black;
}

/* Progress Bar */
.progress-container {
  flex: 1;
  height: 12px;
  background: #222;
  cursor: pointer;
  position: relative;
  border: 1px solid purple;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, purple, #bb66ff);
}

.time {
  font-size: 14px;
  width: 100px;
  text-align: right;
}

/* Visualizer */
.visualizer {
  display: flex;
  gap: 4px;
  height: 25px;
  margin-top: 8px;
}

.bar {
  width: 5px;
  background: #bb66ff;
  animation: bounce 1s infinite ease-in-out;
}

@keyframes bounce {
  0%,100% { height: 5px; }
  50% { height: 25px; }
}

footer {
  text-align: center;
  margin-top: 40px;
  color: #888;
}
</style>
</head>

<body>

<div class="background-animate"></div>

<div class="overlay">

  <div class="logo">
    YOUR BAND LOGO
  </div>

  <div class="playlist" id="playlist"></div>

  <footer>
    © 2026 Your Band Name
  </footer>

</div>

<div class="sticky-player">
  <div class="now-playing" id="nowPlaying">Now Playing: —</div>

  <div class="controls">
    <button class="control-btn" onclick="prevSong()">⏮</button>
    <button class="control-btn" onclick="togglePlay()" id="playBtn">▶</button>
    <button class="control-btn" onclick="nextSong()">⏭</button>
    <button class="control-btn" id="shuffleBtn">🔀</button>
    <button class="control-btn" id="repeatBtn">🔁</button>

    <div class="progress-container" onclick="seek(event)">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time" id="timeDisplay">0:00 / 0:00</div>
  </div>

  <div class="visualizer" id="visualizer"></div>
</div>

<script>
const songs = [
  { title: "Song One", file: "music/song1.mp3", cover: "https://picsum.photos/60?1" },
  { title: "Song Two", file: "music/song2.mp3", cover: "https://picsum.photos/60?2" },
  { title: "Song Three", file: "music/song3.mp3", cover: "https://picsum.photos/60?3" }
];

const audio = new Audio();
audio.volume = 0.9;

const playlistDiv = document.getElementById("playlist");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("timeDisplay");
const nowPlaying = document.getElementById("nowPlaying");
const playBtn = document.getElementById("playBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const repeatBtn = document.getElementById("repeatBtn");
const visualizer = document.getElementById("visualizer");

let currentIndex = 0;
let shuffle = false;
let repeat = false;

/* Visualizer bars */
for (let i = 0; i < 20; i++) {
  const bar = document.createElement("div");
  bar.classList.add("bar");
  bar.style.animationDelay = (i * 0.1) + "s";
  visualizer.appendChild(bar);
}

function loadSong(index) {
  currentIndex = index;
  audio.src = songs[index].file;
  nowPlaying.textContent = "Now Playing: " + songs[index].title;
  highlightSong();
  audio.play();
  playBtn.textContent = "⏸";
  scrollToActive();
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
}

function prevSong() {
  currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  loadSong(currentIndex);
}

function nextSong() {
  if (shuffle) {
    currentIndex = Math.floor(Math.random() * songs.length);
  } else {
    currentIndex = (currentIndex + 1) % songs.length;
  }
  loadSong(currentIndex);
}

audio.addEventListener("timeupdate", () => {
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
  timeDisplay.textContent = formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
});

audio.addEventListener("ended", () => {
  if (repeat) loadSong(currentIndex);
  else nextSong();
});

function seek(e) {
  const width = e.currentTarget.clientWidth;
  const clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
}

function formatTime(seconds) {
  if (!seconds) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return minutes + ":" + (secs < 10 ? "0" : "") + secs;
}

shuffleBtn.onclick = () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("active", shuffle);
};

repeatBtn.onclick = () => {
  repeat = !repeat;
  repeatBtn.classList.toggle("active", repeat);
};

songs.forEach((song, index) => {
  const songDiv = document.createElement("div");
  songDiv.classList.add("song");
  songDiv.innerHTML = `
    <img src="${song.cover}">
    <div class="song-info">${song.title}</div>
    <a class="download" href="${song.file}" download>Download</a>
  `;
  songDiv.onclick = () => loadSong(index);
  playlistDiv.appendChild(songDiv);
});

function highlightSong() {
  document.querySelectorAll(".song").forEach((el, i) => {
    el.classList.toggle("active", i === currentIndex);
  });
}

function scrollToActive() {
  const active = document.querySelector(".song.active");
  active.scrollIntoView({ behavior: "smooth", block: "center" });
}

/* Background change */
const backgrounds = [
  "radial-gradient(circle at center, #4b0082, black 60%)",
  "radial-gradient(circle at center, #2b0033, black 60%)",
  "radial-gradient(circle at center, #000000, #4b0082 70%)"
];

let bgIndex = 0;
function changeBackground() {
  document.body.style.background = backgrounds[bgIndex];
  bgIndex = (bgIndex + 1) % backgrounds.length;
}
changeBackground();
setInterval(changeBackground, 30000);

loadSong(0);
</script>

</body>
</html>
