<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaping Shay</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  background:
    radial-gradient(circle at center, rgba(0,0,0,0.3), rgba(0,0,0,0.85)),
    url("images/background.png") center center / cover no-repeat fixed;
  background-color: black;
}

.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding: 60px 20px 160px 20px;
}

.logo {
  text-align: center;
  margin-bottom: 60px;
}

.logo img {
  max-width: 320px;
  width: 100%;
}

/* Playlist */
.playlist {
  max-width: 800px;
  margin: 0 auto 100px auto;
  max-height: 500px;
  overflow-y: auto;
  border: 1px solid purple;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
}

.song {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  transition: background 0.2s;
}

.song img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border: 1px solid purple;
}

.song:hover {
  background: rgba(128,0,128,0.4);
}

.song.active {
  background: rgba(187,102,255,0.5);
  font-weight: bold;
}

.song-info { flex: 1; }

/* Sticky Player */
.sticky-player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: rgba(10,10,10,0.95);
  border-top: 3px solid purple;
  padding: 15px;
  box-shadow: 0 -5px 20px rgba(187,102,255,0.3);
  backdrop-filter: blur(10px);
}

.now-playing {
  font-weight: bold;
  color: #bb66ff;
  margin-bottom: 10px;
  font-size: 18px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.control-btn {
  border: 2px solid purple;
  background: linear-gradient(145deg, #2b0033, #000);
  color: #bb66ff;
  width: 55px;
  height: 55px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(187,102,255,0.6);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control-btn svg {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.control-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #bb66ff;
}

.control-btn.active {
  box-shadow: 0 0 25px #bb66ff;
}

.progress-container {
  flex: 1;
  height: 18px;
  background: #222;
  cursor: pointer;
  border: 1px solid purple;
  border-radius: 8px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, purple, #bb66ff);
}

.time {
  font-size: 14px;
  width: 110px;
  text-align: right;
}
</style>
</head>

<body>

<div class="overlay">
  <div class="logo">
    <img src="images/logo.png" alt="Band Logo">
  </div>
  <div class="playlist" id="playlist"></div>
</div>

<div class="sticky-player">
  <div class="now-playing" id="nowPlaying">Now Playing: —</div>
  <div class="controls">

    <!-- PREV -->
    <button class="control-btn" id="prevBtn">
      <svg viewBox="0 0 24 24">
        <line x1="19" y1="5" x2="19" y2="19"/>
        <polyline points="15 18 6 12 15 6"/>
      </svg>
    </button>

    <!-- PLAY -->
    <button class="control-btn" id="playBtn">
      <svg id="playIcon" viewBox="0 0 24 24">
        <polygon points="6 4 20 12 6 20 6 4"/>
      </svg>
    </button>

    <!-- NEXT -->
    <button class="control-btn" id="nextBtn">
      <svg viewBox="0 0 24 24">
        <line x1="5" y1="5" x2="5" y2="19"/>
        <polyline points="9 6 18 12 9 18"/>
      </svg>
    </button>

    <!-- SHUFFLE -->
    <button class="control-btn" id="shuffleBtn">
      <svg viewBox="0 0 24 24">
        <polyline points="16 3 21 3 21 8"/>
        <line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/>
        <line x1="15" y1="15" x2="21" y2="21"/>
        <line x1="4" y1="4" x2="9" y2="9"/>
      </svg>
    </button>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time" id="timeDisplay">0:00 / 0:00</div>
  </div>
</div>

<script>
const audio = new Audio();

const playlistDiv = document.getElementById("playlist");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("timeDisplay");
const nowPlaying = document.getElementById("nowPlaying");

const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const progressContainer = document.getElementById("progressContainer");

let shuffleMode = false;
let songs = [];
let currentIndex = 0;

shuffleBtn.onclick = () => {
  shuffleMode = !shuffleMode;
  shuffleBtn.classList.toggle("active", shuffleMode);
};

prevBtn.onclick = () => {
  currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  loadSong(currentIndex, true);
};

nextBtn.onclick = nextSong;

playBtn.onclick = () => {
  audio.paused ? audio.play() : audio.pause();
};

progressContainer.onclick = (e) => {
  const width = e.currentTarget.clientWidth;
  const clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
};

audio.addEventListener("ended", nextSong);

function nextSong() {
  if (shuffleMode) {
    let newIndex;
    do {
      newIndex = Math.floor(Math.random() * songs.length);
    } while (newIndex === currentIndex && songs.length > 1);
    currentIndex = newIndex;
  } else {
    currentIndex = (currentIndex + 1) % songs.length;
  }
  loadSong(currentIndex, true);
}

fetch("music/songs.json")
  .then(res => res.json())
  .then(data => {
    songs = data.map(song => ({
      file: "music/" + song.file,
      title: song.title,
      image: song.image
    }));
    buildPlaylist();
    loadSong(0, false);
  });

function buildPlaylist() {
  playlistDiv.innerHTML = "";
  songs.forEach((song, i) => {
    const songDiv = document.createElement("div");
    songDiv.classList.add("song");
    songDiv.innerHTML = `
      <img src="${song.image}">
      <div class="song-info">${song.title}</div>
    `;
    songDiv.onclick = () => loadSong(i, true);
    playlistDiv.appendChild(songDiv);
  });
}

function loadSong(index, autoPlay = true) {
  currentIndex = index;
  audio.src = songs[index].file;
  nowPlaying.textContent = "Now Playing: " + songs[index].title;
  highlightSong();
  if (autoPlay) audio.play();
}

audio.addEventListener("play", () => {
  playIcon.innerHTML = `
    <line x1="8" y1="5" x2="8" y2="19"/>
    <line x1="16" y1="5" x2="16" y2="19"/>
  `;
});

audio.addEventListener("pause", () => {
  playIcon.innerHTML = `
    <polygon points="6 4 20 12 6 20 6 4"/>
  `;
});

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
  timeDisplay.textContent =
    formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
});

function formatTime(seconds) {
  if (!seconds) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function highlightSong() {
  document.querySelectorAll(".song").forEach((el, i) => {
    el.classList.toggle("active", i === currentIndex);
  });
}
</script>

</body>
</html>
