<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaping Shay</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  background:
    radial-gradient(circle at center, rgba(0,0,0,0.3), rgba(0,0,0,0.85)),
    url("images/background.png") center center / cover no-repeat fixed;
  background-color: black;
}

.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding: 60px 20px 160px 20px;
}

.logo {
  text-align: center;
  margin-bottom: 60px;
}

.logo img {
  max-width: 320px;
  width: 100%;
}

.playlist {
  max-width: 900px;
  margin: 0 auto 100px auto;
  max-height: 500px;
  overflow-y: auto;
  border: 1px solid purple;
  background: rgba(0,0,0,0.6);
}

.song {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  transition: background 0.2s;
}

.song:hover { background: rgba(128,0,128,0.4); }
.song.active { background: rgba(187,102,255,0.5); }

.song img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border: 1px solid purple;
}

.song-info { flex: 1; }

.song-meta {
  font-size: 13px;
  color: #bbb;
  margin-top: 4px;
}

.download-btn {
  padding: 6px 10px;
  background: transparent;
  border: 1px solid #bb66ff;
  color: #bb66ff;
  cursor: pointer;
  font-size: 12px;
}

.sticky-player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: rgba(10,10,10,0.95);
  border-top: 3px solid purple;
  padding: 15px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 15px;
}

.control-btn {
  border: 2px solid purple;
  background: #000;
  color: #bb66ff;
  width: 55px;
  height: 55px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control-btn svg {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.control-btn.active {
  box-shadow: 0 0 15px #bb66ff;
}

.progress-container {
  flex: 1;
  height: 18px;
  background: #222;
  cursor: pointer;
  border: 1px solid purple;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, purple, #bb66ff);
  transition: width 0.1s linear;
}

.time {
  font-size: 14px;
  width: 110px;
  text-align: right;
}
</style>
</head>

<body>

<div class="overlay">
  <div class="logo">
    <img src="images/logo.png">
  </div>

  <div class="playlist" id="playlist"></div>

  <div style="max-width:900px;margin:0 auto 120px auto;padding:40px;background:rgba(0,0,0,0.65);border:1px solid purple;">
    <h2 style="color:#bb66ff;">About Shaping Shay</h2>
    <p>Sample placeholder text describing the artistic vision, tone, and atmosphere of the project.</p>
  </div>

  <div style="max-width:900px;margin:0 auto 120px auto;padding:40px;background:rgba(0,0,0,0.65);border:1px solid purple;">
    <h2 style="color:#bb66ff;">About Shay Herself</h2>
    <p>Sample placeholder biography content. This will be replaced with finalized approved narrative.</p>
  </div>
</div>

<div class="sticky-player">
  <div id="nowPlaying">Now Playing: —</div>
  <div class="controls">

    <button class="control-btn" id="prevBtn">
      <svg viewBox="0 0 24 24">
        <line x1="19" y1="5" x2="19" y2="19"/>
        <polyline points="15 18 6 12 15 6"/>
      </svg>
    </button>

    <button class="control-btn" id="playBtn">
      <svg viewBox="0 0 24 24">
        <polygon points="6 4 20 12 6 20 6 4"/>
      </svg>
    </button>

    <button class="control-btn" id="nextBtn">
      <svg viewBox="0 0 24 24">
        <line x1="5" y1="5" x2="5" y2="19"/>
        <polyline points="9 6 18 12 9 18"/>
      </svg>
    </button>

    <button class="control-btn" id="shuffleBtn">
      <svg viewBox="0 0 24 24">
        <polyline points="16 3 21 3 21 8"/>
        <line x1="4" y1="20" x2="21" y2="3"/>
        <polyline points="21 16 21 21 16 21"/>
        <line x1="15" y1="15" x2="21" y2="21"/>
        <line x1="4" y1="4" x2="9" y2="9"/>
      </svg>
    </button>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time" id="timeDisplay">0:00 / 0:00</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDluUOyyk1qdndO2729JiXkY_0w829ttoc",
  authDomain: "your-band-player.firebaseapp.com",
  projectId: "your-band-player"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const audio = new Audio();
let songs = [];
let currentIndex = 0;
let shuffleMode = false;

const progress = document.getElementById("progress");
const progressContainer = document.getElementById("progressContainer");
const timeDisplay = document.getElementById("timeDisplay");

function formatTime(seconds) {
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return minutes + ":" + (secs < 10 ? "0" + secs : secs);
}

audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progress.style.width = percent + "%";
    timeDisplay.textContent =
      formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
  }
});

progressContainer.addEventListener("click", (e) => {
  const width = progressContainer.clientWidth;
  const clickX = e.offsetX;
  if (audio.duration) {
    audio.currentTime = (clickX / width) * audio.duration;
  }
});

fetch("music/songs.json")
.then(res => res.json())
.then(data => {
  songs = data.map(song => ({
    file: "music/" + song.file,
    title: song.title,
    image: song.image,
    id: song.file
  }));
  buildPlaylist();
});

async function buildPlaylist() {
  const playlist = document.getElementById("playlist");
  playlist.innerHTML = "";

  for (let i = 0; i < songs.length; i++) {
    const docRef = doc(db, "plays", songs[i].id);
    const snap = await getDoc(docRef);
    const count = snap.exists() ? snap.data().count : 0;

    const div = document.createElement("div");
    div.className = "song";

    div.innerHTML = `
      <img src="${songs[i].image}">
      <div class="song-info">
        <div>${songs[i].title}</div>
        <div class="song-meta" id="plays-${i}">${count} plays</div>
      </div>
      <button class="download-btn">Download</button>
    `;

    div.querySelector(".download-btn").onclick = (e) => {
      e.stopPropagation();
      const link = document.createElement("a");
      link.href = songs[i].file;
      link.download = songs[i].title;
      link.click();
    };

    div.onclick = () => loadSong(i, true);
    playlist.appendChild(div);
  }
}

async function incrementPlay(index) {
  const docRef = doc(db, "plays", songs[index].id);
  const snap = await getDoc(docRef);

  if (!snap.exists()) {
    await setDoc(docRef, { count: 1 });
  } else {
    await updateDoc(docRef, { count: increment(1) });
  }

  const updated = await getDoc(docRef);
  document.getElementById(`plays-${index}`).textContent =
    updated.data().count + " plays";
}

function loadSong(index, autoPlay=true) {
  currentIndex = index;
  audio.src = songs[index].file;
  document.getElementById("nowPlaying").textContent =
    "Now Playing: " + songs[index].title;

  if (autoPlay) {
    incrementPlay(index);
    audio.play();
  }
}

document.getElementById("playBtn").onclick =
  () => audio.paused ? audio.play() : audio.pause();

document.getElementById("nextBtn").onclick = () => {
  if (shuffleMode) {
    currentIndex = Math.floor(Math.random()*songs.length);
  } else {
    currentIndex = (currentIndex+1)%songs.length;
  }
  loadSong(currentIndex,true);
};

document.getElementById("prevBtn").onclick =
  () => loadSong((currentIndex-1+songs.length)%songs.length,true);

document.getElementById("shuffleBtn").onclick = () => {
  shuffleMode = !shuffleMode;
  document.getElementById("shuffleBtn")
    .classList.toggle("active", shuffleMode);
};
</script>

</body>
</html>
