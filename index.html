<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaping Shay</title>

<style>

/* ============================
   GLOBAL
============================ */

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f0f0f;
  color: #fff;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

p {
  line-height: 1.6;
  color: #ccc;
}

/* ============================
   PLAYER
============================ */

.player {
  margin-top: 30px;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin-top: 15px;
}

.control-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: white;
  cursor: pointer;
  transition: background 0.2s ease;
}

.control-btn:hover {
  background: rgba(255,255,255,0.08);
}

.control-btn svg {
  width: 22px;
  height: 22px;
}

/* ============================
   PROGRESS BAR
============================ */

#progressContainer {
  width: 100%;
  height: 6px;
  background: #333;
  border-radius: 6px;
  margin-top: 15px;
  cursor: pointer;
  overflow: hidden;
}

#progress {
  height: 100%;
  width: 0%;
  background: #8b5cf6;
}

#timeDisplay {
  text-align: center;
  font-size: 12px;
  margin-top: 6px;
  color: #aaa;
}

#nowPlaying {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
  color: #ccc;
}

/* ============================
   EQUALISER POPUP
============================ */

.eq-panel {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  width: 95%;
  max-width: 520px;
  background: #111;
  padding: 20px 16px;
  border-radius: 18px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.45);
  display: none;
  z-index: 999;
}

.eq-panel.active {
  display: block;
}

.eq-bands {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
}

.eq-band {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 12px;
  color: #ccc;
}

.eq-band input[type="range"] {
  writing-mode: bt-lr;
  -webkit-appearance: slider-vertical;
  height: 120px;
  width: 24px;
  accent-color: #8b5cf6;
}

.eq-band input[type="range"]::-webkit-slider-thumb {
  background: #8b5cf6;
}

.eq-band input[type="range"]::-webkit-slider-runnable-track {
  background: #444;
  border-radius: 4px;
}

@media (max-width: 600px) {
  .eq-band input[type="range"] {
    height: 100px;
    width: 20px;
  }

  .eq-panel {
    bottom: 80px;
  }
}

</style>
</head>
<body>

<h1>Shaping Shay</h1>

<div class="player">

  <div class="controls">

    <!-- Play Button -->
    <button id="playBtn" class="control-btn">
      <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="6 4 20 12 6 20 6 4"></polygon>
      </svg>
    </button>

    <!-- EQ Button -->
    <button id="eqToggle" class="control-btn" aria-label="Equaliser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="4" y1="21" x2="4" y2="14"/>
        <line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/>
        <line x1="20" y1="12" x2="20" y2="3"/>
        <circle cx="4" cy="12" r="2"/>
        <circle cx="12" cy="10" r="2"/>
        <circle cx="20" cy="14" r="2"/>
      </svg>
    </button>

  </div>

  <div id="progressContainer">
    <div id="progress"></div>
  </div>

  <div id="timeDisplay">0:00 / 0:00</div>
  <div id="nowPlaying">Now Playing: —</div>

</div>

<!-- ============================
     EQ PANEL
============================ -->

<div id="eqPanel" class="eq-panel">
  <div class="eq-bands">
    <div class="eq-band">
      <input type="range" min="-10" max="10" value="0" step="1" data-band="0">
      <label>60Hz</label>
    </div>
    <div class="eq-band">
      <input type="range" min="-10" max="10" value="0" step="1" data-band="1">
      <label>230Hz</label>
    </div>
    <div class="eq-band">
      <input type="range" min="-10" max="10" value="0" step="1" data-band="2">
      <label>910Hz</label>
    </div>
    <div class="eq-band">
      <input type="range" min="-10" max="10" value="0" step="1" data-band="3">
      <label>3.6kHz</label>
    </div>
    <div class="eq-band">
      <input type="range" min="-10" max="10" value="0" step="1" data-band="4">
      <label>14kHz</label>
    </div>
  </div>
</div>

<script>

const audio = new Audio("music/sample.mp3"); // change to your track

const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const progress = document.getElementById("progress");
const progressContainer = document.getElementById("progressContainer");
const timeDisplay = document.getElementById("timeDisplay");
const nowPlaying = document.getElementById("nowPlaying");

nowPlaying.textContent = "Now Playing: Sample Track";

// Play toggle
playBtn.onclick = () => {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
};

audio.addEventListener("play", () => {
  playIcon.innerHTML = `
    <line x1="6" y1="4" x2="6" y2="20"/>
    <line x1="18" y1="4" x2="18" y2="20"/>
  `;
});

audio.addEventListener("pause", () => {
  playIcon.innerHTML = `
    <polygon points="6 4 20 12 6 20 6 4"></polygon>
  `;
});

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";

  const format = s => {
    const m = Math.floor(s/60);
    const sec = Math.floor(s%60);
    return m + ":" + (sec < 10 ? "0"+sec : sec);
  };

  timeDisplay.textContent =
    format(audio.currentTime) + " / " + format(audio.duration);
});

// Scrubbing
progressContainer.addEventListener("click", e => {
  const rect = progressContainer.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
});

/* ============================
   EQUALISER
============================ */

const eqToggle = document.getElementById("eqToggle");
const eqPanel = document.getElementById("eqPanel");

let audioContext;
let sourceNode;
let filters = [];
let eqInitialised = false;

function setupEQ() {
  if (eqInitialised) return;

  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioContext = new AudioContext();
  sourceNode = audioContext.createMediaElementSource(audio);

  const frequencies = [60, 230, 910, 3600, 14000];

  filters = frequencies.map(freq => {
    const filter = audioContext.createBiquadFilter();
    filter.type = "peaking";
    filter.frequency.value = freq;
    filter.Q.value = 1;
    filter.gain.value = 0;
    return filter;
  });

  let previous = sourceNode;
  filters.forEach(filter => {
    previous.connect(filter);
    previous = filter;
  });

  previous.connect(audioContext.destination);

  eqInitialised = true;
}

eqToggle.addEventListener("click", e => {
  e.stopPropagation();
  if (!eqInitialised) setupEQ();
  if (audioContext.state === "suspended") audioContext.resume();
  eqPanel.classList.toggle("active");
});

document.addEventListener("pointerdown", e => {
  if (!eqPanel.classList.contains("active")) return;
  if (!eqPanel.contains(e.target) && !eqToggle.contains(e.target)) {
    eqPanel.classList.remove("active");
  }
});

document.querySelectorAll(".eq-band input").forEach(slider => {
  slider.addEventListener("input", e => {
    const bandIndex = parseInt(e.target.dataset.band);
    if (filters[bandIndex]) {
      filters[bandIndex].gain.value = e.target.value;
    }
  });
});

</script>

</body>
</html>
