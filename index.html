<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaping Shay</title>

<!-- Firebase SDK (Modular v10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ✅ REPLACE WITH YOUR OWN CONFIG
  const firebaseConfig = {
  apiKey: "AIzaSyDluUOyyk1qdndO2729JiXkY_0w829ttoc",
  authDomain: "your-band-player.firebaseapp.com",
  projectId: "your-band-player",
  storageBucket: "your-band-player.firebasestorage.app",
  messagingSenderId: "43893185871",
  appId: "1:43893185871:web:35c2f3e5fcab4bb2d1393a"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.firebaseTools = { doc, getDoc, setDoc, updateDoc, increment, onSnapshot };
</script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  overflow-x: hidden;
  background: black;
}

.background-animate {
  position: fixed;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background: radial-gradient(circle at center, #4b0082, black 60%);
  animation: moveBg 25s linear infinite;
  z-index: -2;
  opacity: 0.5;
}

@keyframes moveBg {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.overlay {
  background: rgba(0,0,0,0.85);
  min-height: 100vh;
  padding: 30px 20px 140px 20px;
}

.logo {
  text-align: center;
  margin-bottom: 40px;
}

.logo img {
  max-width: 320px;
  width: 100%;
}

.playlist {
  max-width: 800px;
  margin: 0 auto;
  max-height: 500px;
  overflow-y: auto;
  border: 1px solid purple;
  background: rgba(0,0,0,0.6);
}

.song {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  transition: background 0.2s;
}

.song img {
  width: 55px;
  height: 55px;
  object-fit: cover;
  border: 1px solid purple;
}

.song:hover {
  background: rgba(128,0,128,0.4);
}

.song.active {
  background: rgba(187,102,255,0.5);
  font-weight: bold;
}

.song-info {
  flex: 1;
}

.play-count {
  font-size: 13px;
  color: #aaa;
  margin-top: 4px;
}

.download {
  color: #bb66ff;
  text-decoration: none;
  font-size: 14px;
}

.sticky-player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0a0a0a;
  border-top: 3px solid purple;
  padding: 15px;
  box-shadow: 0 -5px 20px rgba(187,102,255,0.3);
}

.now-playing {
  font-weight: bold;
  color: #bb66ff;
  margin-bottom: 10px;
  font-size: 18px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.control-btn {
  appearance: none;
  -webkit-appearance: none;
  border: 2px solid purple;
  background: linear-gradient(145deg, #2b0033, #000);
  color: #bb66ff;
  width: 55px;
  height: 55px;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(187,102,255,0.6);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.control-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px #bb66ff;
}

@keyframes pulseGlow {
  0%   { box-shadow: 0 0 10px rgba(187,102,255,0.6); }
  50%  { box-shadow: 0 0 25px rgba(187,102,255,1); }
  100% { box-shadow: 0 0 10px rgba(187,102,255,0.6); }
}

.control-btn.playing {
  animation: pulseGlow 1.5s infinite ease-in-out;
}

.progress-container {
  flex: 1;
  height: 18px;
  background: #222;
  cursor: pointer;
  border: 1px solid purple;
  border-radius: 8px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, purple, #bb66ff);
}

.time {
  font-size: 14px;
  width: 110px;
  text-align: right;
}
</style>
</head>

<body>

<div class="background-animate"></div>

<div class="overlay">
  <div class="logo">
    <img src="images/logo.png" alt="Band Logo">
  </div>

  <div class="playlist" id="playlist"></div>
</div>

<div class="sticky-player">
  <div class="now-playing" id="nowPlaying">Now Playing: —</div>
  <div class="controls">
  <button class="control-btn" id="prevBtn">⏮</button>
  <button class="control-btn" id="playBtn">▶</button>
  <button class="control-btn" id="nextBtn">⏭</button>

  <div class="progress-container" id="progressContainer">
    <div class="progress" id="progress"></div>
  </div>

  <div class="time" id="timeDisplay">0:00 / 0:00</div>
</div>
</div>

<script type="module">
import { doc, getDoc, setDoc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = window.db;

const audio = new Audio();
const playlistDiv = document.getElementById("playlist");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("timeDisplay");
const nowPlaying = document.getElementById("nowPlaying");
const playBtn = document.getElementById("playBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const progressContainer = document.getElementById("progressContainer");

prevBtn.addEventListener("click", prevSong);
nextBtn.addEventListener("click", nextSong);
playBtn.addEventListener("click", togglePlay);
progressContainer.addEventListener("click", seek);
let songs = [];
let currentIndex = 0;
let hasCountedPlay = false;

fetch("music/songs.json")
  .then(res => res.json())
  .then(data => {
    songs = data.map(song => ({
      file: "music/" + song.file,
      title: song.title,
      image: song.image
    }));
    buildPlaylist();
    loadSong(0, false);
  });

async function buildPlaylist() {
  playlistDiv.innerHTML = "";

  for (let i = 0; i < songs.length; i++) {
    const song = songs[i];
    const songId = song.file.replace(/\W/g, "_");
    const songRef = doc(db, "plays", songId);

    const songDiv = document.createElement("div");
    songDiv.classList.add("song");

    songDiv.innerHTML = `
      <img src="${song.image}">
      <div class="song-info">
        <div>${song.title}</div>
        <div class="play-count" id="plays-${i}">0 plays</div>
      </div>
      <a class="download" href="${song.file}" download>Download</a>
    `;

    songDiv.onclick = () => loadSong(i, true);
    playlistDiv.appendChild(songDiv);

    onSnapshot(songRef, (docSnap) => {
      const count = docSnap.exists() ? docSnap.data().count : 0;
      document.getElementById(`plays-${i}`).textContent = count + " plays";
    });
  }
}

async function incrementPlay() {
  const song = songs[currentIndex];
  const songId = song.file.replace(/\W/g, "_");
  const songRef = doc(db, "plays", songId);

  await setDoc(songRef, { count: increment(1) }, { merge: true });
}

function loadSong(index, autoPlay = true) {
  currentIndex = index;
  audio.src = songs[index].file;
  nowPlaying.textContent = "Now Playing: " + songs[index].title;

  hasCountedPlay = false; // ✅ Reset for new song

  highlightSong();

  if (autoPlay) audio.play();
}

function togglePlay() {
  audio.paused ? audio.play() : audio.pause();
}

function prevSong() {
  currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  loadSong(currentIndex, true);
}

function nextSong() {
  currentIndex = (currentIndex + 1) % songs.length;
  loadSong(currentIndex, true);
}

audio.addEventListener("play", () => {

  playBtn.textContent = "⏸";
  playBtn.classList.add("playing");

  // ✅ Only count first actual play
  if (!hasCountedPlay) {
    incrementPlay();
    hasCountedPlay = true;
  }
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  playBtn.classList.remove("playing");
});

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
  timeDisplay.textContent =
    formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
});

function seek(e) {
  const width = e.currentTarget.clientWidth;
  const clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
}

function formatTime(seconds) {
  if (!seconds) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return minutes + ":" + (secs < 10 ? "0" : "") + secs;
}

function highlightSong() {
  document.querySelectorAll(".song").forEach((el, i) => {
    el.classList.toggle("active", i === currentIndex);
  });
}
</script>

</body>
</html>
