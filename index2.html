<script>
const audio = new Audio();
audio.volume = 0.9;

const playlistDiv = document.getElementById("playlist");
const progress = document.getElementById("progress");
const timeDisplay = document.getElementById("timeDisplay");
const nowPlaying = document.getElementById("nowPlaying");
const playBtn = document.getElementById("playBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const repeatBtn = document.getElementById("repeatBtn");

let songs = [];
let currentIndex = 0;
let shuffle = false;
let repeat = false;

/* Load songs */
fetch("music/songs.json")
  .then(res => res.json())
  .then(data => {
    songs = data.map(song => ({
      file: "music/" + song.file,
      title: song.title,
      image: song.image
    }));

    buildPlaylist();
    loadSong(0, false); // no autoplay
  });

function buildPlaylist() {
  playlistDiv.innerHTML = "";

  songs.forEach((song, index) => {
    const songDiv = document.createElement("div");
    songDiv.classList.add("song");
    songDiv.innerHTML = `
      <img src="${song.image}" alt="${song.title}">
      <div class="song-info">${song.title}</div>
      <a class="download" href="${song.file}" download>Download</a>
    `;
    songDiv.onclick = () => loadSong(index, true);
    playlistDiv.appendChild(songDiv);
  });
}

function loadSong(index, autoPlay = true) {
  currentIndex = index;
  audio.src = songs[index].file;
  nowPlaying.textContent = "Now Playing: " + songs[index].title;
  highlightSong();
  scrollToActive();

  if (autoPlay) {
    audio.play();
  }
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function prevSong() {
  currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  loadSong(currentIndex, true);
}

function nextSong() {
  if (shuffle) {
    currentIndex = Math.floor(Math.random() * songs.length);
  } else {
    currentIndex = (currentIndex + 1) % songs.length;
  }
  loadSong(currentIndex, true);
}

/* ✅ Glow animation controlled by audio events */

audio.addEventListener("play", () => {
  playBtn.textContent = "⏸";
  playBtn.classList.add("playing");
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  playBtn.classList.remove("playing");
});

audio.addEventListener("ended", () => {
  if (repeat) loadSong(currentIndex, true);
  else nextSong();
});

audio.addEventListener("timeupdate", () => {
  if (!audio.duration) return;
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";
  timeDisplay.textContent =
    formatTime(audio.currentTime) + " / " + formatTime(audio.duration);
});

function seek(e) {
  const width = e.currentTarget.clientWidth;
  const clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
}

function formatTime(seconds) {
  if (!seconds) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return minutes + ":" + (secs < 10 ? "0" : "") + secs;
}

shuffleBtn.onclick = () => {
  shuffle = !shuffle;
  shuffleBtn.classList.toggle("active", shuffle);
};

repeatBtn.onclick = () => {
  repeat = !repeat;
  repeatBtn.classList.toggle("active", repeat);
};

function highlightSong() {
  document.querySelectorAll(".song").forEach((el, i) => {
    el.classList.toggle("active", i === currentIndex);
  });
}

function scrollToActive() {
  const active = document.querySelector(".song.active");
  if (active) {
    active.scrollIntoView({ behavior: "smooth", block: "center" });
  }
}
</script>
